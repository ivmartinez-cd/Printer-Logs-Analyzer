

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=printerapp
      - POSTGRES_PASSWORD=printer_secure_pass_2026
      - POSTGRES_DB=printer_logs
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-network
    ports:
      - "5432:5432"
    # Essential for 2026 standards: avoid boot race conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printerapp -d printer_logs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://printerapp:printer_secure_pass_2026@db:5432/printer_logs
      - API_KEY=${API_KEY:-dev}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SDS_WEB_USERNAME=${SDS_WEB_USERNAME}
      - SDS_WEB_PASSWORD=${SDS_WEB_PASSWORD}
      - INSIGHT_PORTAL_URL=${INSIGHT_PORTAL_URL}
      - INSIGHT_API_KEY=${INSIGHT_API_KEY}
      - INSIGHT_API_SECRET=${INSIGHT_API_SECRET}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend # Sincronización de código backend
    # Usar --reload para desarrollo (Ruta correcta de la app)
    command: uvicorn backend.interface.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - backend-network
      - frontend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build # Usamos la etapa que tiene Node.js para desarrollo
      args:
        - VITE_API_KEY=${API_KEY:-dev}
    restart: unless-stopped
    ports:
      - "5173:5173" # Cambiamos al puerto de desarrollo de Vite
    environment:
      - VITE_API_BASE=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_WATCH_USE_POLLING=true
    depends_on:
      - backend
    networks:
      - frontend-network
    env_file:
      - .env
    volumes:
      - ./frontend:/app # Sincronización de código frontend
      - /app/node_modules # Evitar que los node_modules locales pisen los del contenedor
    # En desarrollo usamos npm run dev en lugar de Nginx
    command: npm run dev -- --host 0.0.0.0 --port 5173

networks:
  backend-network:
    name: printer_backend_isolated
  frontend-network:
    name: printer_frontend_isolated

volumes:
  db_data:
