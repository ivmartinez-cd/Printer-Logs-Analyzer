

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=printerapp
      - POSTGRES_PASSWORD=printer_secure_pass_2026
      - POSTGRES_DB=printer_logs
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-network
    ports:
      - "5433:5432"
    # Essential for 2026 standards: avoid boot race conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printerapp -d printer_logs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://printerapp:printer_secure_pass_2026@db:5432/printer_logs
      - API_KEY=${API_KEY:-dev}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SDS_WEB_USERNAME=${SDS_WEB_USERNAME}
      - SDS_WEB_PASSWORD=${SDS_WEB_PASSWORD}
      - INSIGHT_PORTAL_URL=${INSIGHT_PORTAL_URL}
      - INSIGHT_API_KEY=${INSIGHT_API_KEY}
      - INSIGHT_API_SECRET=${INSIGHT_API_SECRET}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - backend-network
      - frontend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_KEY=${API_KEY:-dev}
        - VITE_API_BASE=http://localhost:8000
        - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    ports:
      - "5175:8080" # Map host 5175 to Nginx production port 8080
    depends_on:
      - backend
    networks:
      - frontend-network
    env_file:
      - .env


networks:
  backend-network:
    name: printer_backend_isolated
  frontend-network:
    name: printer_frontend_isolated

volumes:
  db_data:
